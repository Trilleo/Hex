# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.1.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_kotlin_version=1.13.13+kotlin.2.4.10

# Mod Properties
mod_version=1.11.2
maven_group=net.trilleo

# Dependencies
fabric_api_version=0.155.0+26.1.2
# Compile-only, never shipped and never required at runtime — see build.gradle. 18.x is the Mod Menu line
# built for Minecraft 26.1; 19+ targets 26.2 and later.
modmenu_version=18.0.0-beta.1
# Test-only, never shipped. Covers the pure-logic code that touches no Minecraft runtime.
junit_version=5.11.4
